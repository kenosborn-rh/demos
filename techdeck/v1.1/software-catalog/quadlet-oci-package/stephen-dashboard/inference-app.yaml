apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: inference-train-demo
  catalog: edge-ai-apps
  
spec:
  displayName: Inference (Edge AI Train Control)
  shortDescription: Edge AI inference app for train demo with camera input
  category: application
  type: container

  # v1.x only shipped container; v2.0 added qcow2; v3.0 added iso.
  artifacts:
    - type: container
      uri: quay.io/kenosborn/inference-train-demo

  versions:
    # v5: Fast Channel
    - version: "5.0.0"
      references:
        container: "v5"
      channels: [fast]
      replaces: "4.0.0"

    # v4: Stable Channel
    - version: "4.0.0"
      references:
        container: "v4"
      channels: [stable, fast]
      replaces: "3.0.0"
      readme: |
        ## Inference Train Demo 4.0.0 (Stable)
        Stable release with enhanced dashboard capability.

    # v3: Stable Channel
    - version: "3.0.0"
      references:
        container: "v3"
      channels: [stable, fast]
      replaces: "2.0.0"
      readme: |
        ## Inference Train Demo 3.0.0 (Stable)
        Stable release with updated model and improved detection capability.

    # v2: Stable Channel
    - version: "2.0.0"
      references:
        container: "v2"
      channels: [stable, fast]
      replaces: "1.0.0"
      readme: |
        ## Inference Train Demo 2.0.0 (Stable)
        Stable release with updated model and improved detection capability.

    # v1: Stable Channel
    - version: "1.0.0"
      references:
        container: "v1"
      channels: [stable, fast]
      replaces: "1.0.0"
      readme: |
        ## Inference Train Demo 1.0.0 (Stable)
        Initial stable release of the edge AI inference application for train control.

  defaults:
    config:
      envVars:
        CAM_W: "640"
        CAM_H: "480"
        DISPLAY_SIZE: "800"
        USE_PAPER_GATE: "false"
        ARM_THRESHOLD: "0.93"
        MARGIN_MIN: "0.50"
        STABLE_FRAMES: "6"
        COOLDOWN_SEC: "3.0"
        MQTT_ENABLED: "false"
        MQTT_BROKER: "10.20.0.150"
        MQTT_PORT: "1883"
        MQTT_TOPIC: "train/cmd"
      ports:
        - "8080:8080"
